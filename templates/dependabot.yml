# Template from sascha-gruesshaber/ci. Adjust `package-ecosystem` in the first block to
# the project (npm, bun; pnpm projects use "npm"), and add groups for packages that may
# only move together.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    # Broken releases are usually pulled within the first few days. Security updates
    # bypass the cooldown.
    cooldown:
      default-days: 7
    # Everything small in one pull request: one CI run, one merge, one deployment. Major
    # versions get a pull request each and are not merged automatically.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
