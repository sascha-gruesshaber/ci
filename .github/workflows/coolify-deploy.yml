name: coolify-deploy

# Triggers Coolify and waits until the new commit is actually running. Contract:
# README.md, section "coolify-deploy.yml".
on:
  workflow_call:
    inputs:
      uuids:
        description: UUIDs of the Coolify applications, separated by spaces or newlines
        required: true
        type: string
      revision-urls:
        description: URLs whose body must contain "revision":"<github.sha>"
        type: string
        default: ""
      urls:
        description: URLs that only need to answer with HTTP 2xx
        type: string
        default: ""
      environment:
        description: GitHub environment
        type: string
        default: production
      environment-url:
        description: URL GitHub shows on the environment
        type: string
        default: ""
      coolify-url:
        type: string
        default: https://coolify.gruesshaber.eu
      wait-minutes:
        description: How long to wait for the new revision
        type: number
        default: 10
    secrets:
      COOLIFY_API_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # The actual waiting is bounded by `wait-minutes` in the script. This is only the
    # safety net below it; expressions cannot do arithmetic.
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment-url }}
    # The containers migrate on startup. A cancelled deployment can leave a migration
    # half done, so deployments run one after another and are never cancelled.
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # The script lives here on purpose and not in a separate file: otherwise every
      # caller would also have to check out this repository at exactly the commit of
      # the ref it called. test/coolify-deploy.test.sh extracts this block and runs it
      # against a dummy server. That is why it contains no `${{ … }}` expressions;
      # everything comes in through the environment.
      - name: Trigger and verify
        env:
          UUIDS: ${{ inputs.uuids }}
          REVISION_URLS: ${{ inputs.revision-urls }}
          URLS: ${{ inputs.urls }}
          COOLIFY_URL: ${{ inputs.coolify-url }}
          WAIT_MINUTES: ${{ inputs.wait-minutes }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          # GitHub starts `run` with `bash -e`. That has to go: a failed request while
          # waiting (timeout, connection refused while the container is being replaced)
          # is an answer like any other and is retried instead of ending the run. A
          # single curl timeout (exit 28) once turned a run red although everything was
          # long up.
          set +e -uo pipefail

          revision="${GITHUB_SHA:?}"
          coolify="${COOLIFY_URL%/}"
          # Overridable for the test only.
          interval="${POLL_INTERVAL:-10}"
          wait_seconds="${WAIT_SECONDS:-$(( WAIT_MINUTES * 60 ))}"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"

          # Splits on spaces and newlines, without globbing.
          read -r -d '' -a uuids <<< "$UUIDS" || true
          read -r -d '' -a revision_urls <<< "$REVISION_URLS" || true
          read -r -d '' -a plain_urls <<< "$URLS" || true

          if [ "${#uuids[@]}" -eq 0 ]; then
            echo "::error::No Coolify UUID given. Is the repository variable COOLIFY_UUID (or COOLIFY_UUID_<APP>) missing?"
            exit 1
          fi
          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "::error::The secret COOLIFY_API_TOKEN is empty."
            exit 1
          fi

          {
            echo "### Deployment"
            echo
            echo "Revision \`${revision}\`"
            echo
          } >> "$summary"

          # 1. Trigger. POST with the parameters in the query string, as Coolify's
          # OpenAPI specification says. GET has answered 405 since Coolify 4.3.2, and a
          # JSON body is ignored. Every UUID is tried; if Coolify rejects one, the run
          # ends red instead of putting a green check mark on a commit that runs
          # nowhere.
          failed=0
          for uuid in "${uuids[@]}"; do
            echo "Triggering ${uuid} …"
            if curl --fail-with-body --silent --show-error --request POST \
                --max-time 30 --header @- \
                "${coolify}/api/v1/deploy?uuid=${uuid}&force=false" \
                <<< "Authorization: Bearer ${COOLIFY_API_TOKEN}"; then
              echo
              echo "- ✅ \`${uuid}\` triggered" >> "$summary"
            else
              echo
              echo "::error::Coolify rejected the deployment of ${uuid}."
              echo "- ❌ \`${uuid}\` rejected" >> "$summary"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          # 2. Wait until every URL reports the new commit. No fixed initial pause: the
          # first request usually still hits the old container, which rightly reports
          # the old revision, and then we simply keep asking.
          declare -A last=()
          pending=()
          for url in "${revision_urls[@]}"; do pending+=("revision ${url}"); done
          for url in "${plain_urls[@]}"; do pending+=("status ${url}"); done

          if [ "${#pending[@]}" -gt 0 ]; then
            echo >> "$summary"
            echo "Waiting up to ${wait_seconds} s for ${#pending[@]} URL(s) …"
          fi

          deadline=$(( SECONDS + wait_seconds ))
          while [ "${#pending[@]}" -gt 0 ]; do
            still=()
            for entry in "${pending[@]}"; do
              kind="${entry%% *}"
              url="${entry#* }"
              body=$(curl --silent --show-error --max-time 10 --write-out '\n%{http_code}' "$url" 2>&1)
              code="${body##*$'\n'}"
              body="${body%$'\n'*}"
              last[$url]="HTTP ${code}: ${body:0:300}"
              ok=0
              if [ "$kind" = revision ]; then
                if [[ "$code" == 2* ]] && grep -Eq "\"revision\"[[:space:]]*:[[:space:]]*\"${revision}\"" <<< "$body"; then ok=1; fi
              else
                if [[ "$code" == 2* ]]; then ok=1; fi
              fi
              if [ "$ok" -eq 1 ]; then
                echo "✅ ${url}"
                echo "- ✅ ${url}" >> "$summary"
              else
                still+=("$entry")
              fi
            done
            pending=("${still[@]}")
            [ "${#pending[@]}" -eq 0 ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              for entry in "${pending[@]}"; do
                url="${entry#* }"
                if [ "${entry%% *}" = revision ]; then
                  echo "::error::${url} does not report revision ${revision} after ${wait_seconds} s. Last response: ${last[$url]}"
                else
                  echo "::error::${url} does not answer with 2xx after ${wait_seconds} s. Last response: ${last[$url]}"
                fi
                echo "- ❌ ${url}: ${last[$url]:0:120}" >> "$summary"
              done
              exit 1
            fi
            echo "… ${#pending[@]} still pending, $(( deadline - SECONDS )) s left"
            sleep "$interval"
          done

          echo "Done."
