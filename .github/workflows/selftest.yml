name: selftest

# Exercises the building blocks the way a project calls them, before a new v1 tag is
# set. Manual only: it pushes to ghcr.io/sascha-gruesshaber/ci/selftest.
# It does not call coolify-deploy.yml, there is no test application for that. Its logic
# is checked by test/coolify-deploy.test.sh against a dummy server, here and in ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    # The state of this branch, not @v1.
    uses: ./.github/workflows/docker-image.yml
    with:
      image: ghcr.io/${{ github.repository }}/selftest
      dockerfile: test/Dockerfile
      context: test
      target: runner
      build-args: |
        SELFTEST_GREETING=hello
      smoke-test: bash test/smoke-test.sh

  # Is the image really in the registry with both tags, and is the output right?
  pushed:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check tags and labels
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          expected="ghcr.io/${GITHUB_REPOSITORY,,}/selftest:sha-${GITHUB_SHA::12}"
          if [ "$IMAGE" != "$expected" ]; then
            echo "::error::Output image is '${IMAGE}' instead of '${expected}'"
            exit 1
          fi
          for ref in "$IMAGE" "${IMAGE%:*}:main"; do
            revision=$(docker buildx imagetools inspect "$ref" \
              --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')
            echo "${ref}: ${revision}"
            if [ "$revision" != "$GITHUB_SHA" ]; then
              echo "::error::${ref} carries revision '${revision}' instead of '${GITHUB_SHA}'"
              exit 1
            fi
          done

  deploy-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash test/coolify-deploy.test.sh
