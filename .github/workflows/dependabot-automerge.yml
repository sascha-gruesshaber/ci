name: dependabot-automerge

# Merges minor and patch updates from Dependabot and then triggers the pipeline on main.
# Contract: README.md, section "dependabot-automerge.yml".
on:
  workflow_call:
    inputs:
      workflow:
        description: Workflow file triggered on main after the merge
        type: string
        default: ci.yml

jobs:
  automerge:
    name: Merge Dependabot update
    # Belt and braces: even if the caller forgets the condition, this job only merges
    # pull requests from Dependabot.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The caller grants the permissions (contents, pull-requests, actions: write).
    steps:
      # The pull request title is just text. Only this action tells what kind of bump it
      # contains. For a group it reports the largest bump in the group: one major
      # version in the bundle holds up the whole pull request, which is the safe
      # direction.
      - name: What does this pull request change?
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # A major version waits until a human has read its changelog. Its pull request
      # then sits there green and tested, one click away from merging.
      - name: Merge unless it is a major version
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A push made with GITHUB_TOKEN does not start any workflow. That is how GitHub
      # prevents workflows from triggering each other endlessly. The merge above is such
      # a push: the pipeline would never build this commit, and the update would sit on
      # main until someone happens to merge something else. `workflow_dispatch` is the
      # documented exception, so the pipeline is triggered explicitly here. It builds
      # whatever is on main at that point, i.e. the commit just merged.
      #
      # `-R` is not a convenience: this job checks nothing out, and without a working
      # copy `gh` cannot infer the repository. It then fails with `fatal: not a git
      # repository`, after the merge, so the update lands on main and is never
      # deployed. `gh pr merge` is not affected because it gets the pull request URL.
      - name: Trigger the pipeline on main
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh workflow run "$WORKFLOW" --ref main -R "$GITHUB_REPOSITORY"
        env:
          WORKFLOW: ${{ inputs.workflow }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
