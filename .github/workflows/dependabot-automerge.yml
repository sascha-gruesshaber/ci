name: dependabot-automerge

# Führt Minor- und Patch-Updates von Dependabot zusammen und stößt danach die Pipeline
# auf main an. Vertrag: README.md, Abschnitt „dependabot-automerge.yml“.
on:
  workflow_call:
    inputs:
      workflow:
        description: Workflow-Datei, die nach dem Merge auf main angestoßen wird
        type: string
        default: ci.yml

jobs:
  automerge:
    name: Dependabot zusammenführen
    # Doppelt hält besser: Auch wenn der Aufrufer die Bedingung vergisst, führt dieser
    # Job nur PRs von Dependabot zusammen.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Die Berechtigungen gibt der Aufrufer (contents, pull-requests, actions: write).
    steps:
      # Der PR-Titel ist nur Text. Was für ein Sprung darin steckt, sagt erst diese
      # Action. Bei einer Gruppe meldet sie den größten Sprung der Gruppe: Eine
      # Hauptversion im Bund hält den ganzen PR auf, und das ist die sichere Richtung.
      - name: Was ändert dieser Pull Request?
        id: metadaten
        uses: dependabot/fetch-metadata@v3

      # Eine Hauptversion bleibt liegen, bis Sascha ihre Changelogs gelesen hat. Ihr PR
      # steht dann grün und geprüft da und wartet auf einen Klick.
      - name: Zusammenführen, wenn es keine Hauptversion ist
        if: steps.metadaten.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ein Push, den GITHUB_TOKEN auslöst, startet keinen Workflow. So verhindert GitHub,
      # dass Abläufe sich endlos gegenseitig anstoßen. Der Merge oben ist so ein Push: Die
      # Pipeline würde diesen Stand nie bauen, und die Aktualisierung läge auf main herum,
      # bis zufällig jemand etwas anderes zusammenführt. `workflow_dispatch` ist die
      # dokumentierte Ausnahme, deshalb wird die Pipeline hier ausdrücklich angestoßen. Sie
      # baut den Stand, der dann auf main liegt, also den eben zusammengeführten.
      #
      # `-R` ist keine Bequemlichkeit: Dieser Job checkt nichts aus, und ohne Arbeitskopie
      # kann `gh` das Repository nicht ableiten. Es scheitert dann an `fatal: not a git
      # repository`, und zwar nach dem Merge, sodass die Aktualisierung auf main liegt und
      # nirgends läuft (Staplerschule, Lauf 31990595275). `gh pr merge` betrifft das nicht,
      # weil es die URL des Pull Requests bekommt.
      - name: Pipeline auf main anstoßen
        if: steps.metadaten.outputs.update-type != 'version-update:semver-major'
        run: gh workflow run "$WORKFLOW" --ref main -R "$GITHUB_REPOSITORY"
        env:
          WORKFLOW: ${{ inputs.workflow }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
