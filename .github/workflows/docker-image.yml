name: docker-image

# Builds an image and pushes it to ghcr.io. Contract: README.md, section
# "docker-image.yml".
on:
  workflow_call:
    inputs:
      image:
        description: Image name without a tag, e.g. ghcr.io/owner/repo
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root
        type: string
        default: Dockerfile
      context:
        description: Build context
        type: string
        default: .
      target:
        description: Multi-stage target
        type: string
        default: ""
      build-args:
        description: Additional build arguments, one per line
        type: string
        default: ""
      smoke-test:
        description: Command run against the image after the build, with IMAGE=<sha reference>
        type: string
        default: ""
    outputs:
      image:
        description: The built reference with the sha tag
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The caller grants the permissions (contents: read, packages: write).
    outputs:
      image: ${{ steps.names.outputs.image }}
    steps:
      # The build context and the smoke test live in the caller's repository.
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine names
        id: names
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          # ghcr.io only accepts lowercase, but `github.repository` keeps the owner's
          # spelling.
          image="${IMAGE,,}"
          if [ -z "$image" ] || [[ "${image##*/}" == *:* ]] || [[ "$image" == *@* ]]; then
            echo "::error::'image' must be an image name without a tag, got: '${IMAGE}'"
            exit 1
          fi
          {
            echo "name=${image}"
            echo "image=${image}:sha-${GITHUB_SHA::12}"
            # Captured once so that the build argument and the label name the same
            # moment. Two calls to `date` may differ.
            echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # One cache per image. Otherwise the rows of a matrix build evict each other
            # from the shared default cache.
            echo "cache-scope=$(printf '%s' "$image" | tr -c 'a-z0-9._-' '-')"
          } >> "$GITHUB_OUTPUT"

      # With a smoke test: load locally, test, and only then push. Without: build and
      # push in one step. Both paths use the same parameters; only `push` and `load`
      # differ.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          # Relative to the repository root, like `docker build -f`, not to the context.
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          push: ${{ inputs.smoke-test == '' }}
          load: ${{ inputs.smoke-test != '' }}
          # The Coolify server is x86, and so are the runners, so this builds natively
          # instead of through QEMU.
          platforms: linux/amd64
          # Without a provenance attestation the result is a plain image instead of an
          # index with an "unknown/unknown" entry. That way both paths (pushed directly,
          # or with `docker push` after the smoke test) look the same.
          provenance: false
          # `sha-…` names exactly this commit, `main` is the pointer Coolify follows.
          tags: |
            ${{ steps.names.outputs.image }}
            ${{ steps.names.outputs.name }}:main
          build-args: |
            APP_REVISION=${{ github.sha }}
            APP_BUILT_AT=${{ steps.names.outputs.built-at }}
            ${{ inputs.build-args }}
          # Answers "what is in the registry?" without running anything:
          # `docker buildx imagetools inspect <image>`.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.names.outputs.built-at }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ steps.names.outputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.cache-scope }}

      - name: Smoke test
        if: inputs.smoke-test != ''
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
        run: bash -eo pipefail -c "$SMOKE_TEST"

      # Exactly the image that passed the smoke test, not a second build.
      - name: Push
        if: inputs.smoke-test != ''
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          NAME: ${{ steps.names.outputs.name }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          docker push "${NAME}:main"

      - name: Summary
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          NAME: ${{ steps.names.outputs.name }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
        run: |
          {
            echo "### Image built"
            echo
            echo "- \`${IMAGE}\`"
            echo "- \`${NAME}:main\`"
            if [ -n "$SMOKE_TEST" ]; then echo "- Smoke test passed"; fi
          } >> "$GITHUB_STEP_SUMMARY"
